@if (memberService.member(); as member) {
  <div class="flex flex-col gap-3">
    <div class="flex gap-3">
      <span class="font-semibold">Member since:</span>
      <span class="">{{ member.created | date: 'shortDate' }}</span>
    </div>
    <div class="flex gap-3">
      <span class="font-semibold">Last active:</span>
      <span class="">{{ member.lastActive | date: 'dd MMM yyyy h:mm a' }}</span>
    </div>
    <h3 class="text-lg font-semibold text-primary">About {{ member.displayName }}</h3>
    @if (memberService.editMode()) {
      <form
        #memberEditForm="ngForm"
        (ngSubmit)="updateProfile()"
        class="flex flex-col w-full gap-3"
      >
        <label class="floating-label">
          <span>Display Name</span>
          <input
            name="displayName"
            type="text"
            [(ngModel)]="editableMember.displayName"
            placeholder="Display Name"
            class="input w-full"
          />
        </label>

        <label class="floating-label">
          <span>Description</span>
          <textarea
            name="description"
            type="text"
            [(ngModel)]="editableMember.description"
            placeholder="Description"
            class="textarea w-full"
          ></textarea>
        </label>

        <label class="floating-label">
          <span>City</span>
          <input
            name="city"
            type="text"
            [(ngModel)]="editableMember.city"
            placeholder="City"
            class="input w-full"
          />
        </label>

        <label class="floating-label">
          <span>Country</span>
          <input
            name="country"
            type="text"
            [(ngModel)]="editableMember.country"
            placeholder="Country"
            class="input w-full"
          />
        </label>
        <div class="flex self-end">
          <button [disabled]="!memberEditForm.dirty" type="submit" class="btn btn-success">
            Update Profile
          </button>
        </div>
      </form>
    } @else {
      <div>{{ member.description }}</div>
    }
  </div>
}
